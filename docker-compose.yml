services:
  postgres:
    image: postgres:16-alpine
    container_name: integra-postgres
    environment:
      POSTGRES_USER: integra
      POSTGRES_PASSWORD: integra_dev
      POSTGRES_DB: integra
      # Ordenación determinista: sin esto, el orden de los índices depende
      # del locale de la imagen y las pruebas fallan en unas máquinas y en
      # otras no.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      # 5432 y 5433 caen dentro de los rangos que Windows reserva para Hyper-V
      # (comprobable con: netsh interface ipv4 show excludedportrange protocol=tcp).
      # 5544 está en un hueco libre.
      - "5544:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integra -d integra"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: integra-api
    command: ["serve"]
    restart: unless-stopped
    environment:
      INTEGRA_DATABASE_URL: postgres://integra:integra_dev@postgres:5432/integra?sslmode=disable
      INTEGRA_MASTER_KEY: ${INTEGRA_MASTER_KEY:?define INTEGRA_MASTER_KEY, generala con go run ./cmd/integra genkey}
      INTEGRA_HTTP_ADDR: ":8080"
      INTEGRA_LOG_LEVEL: ${INTEGRA_LOG_LEVEL:-info}
      INTEGRA_IMAGE_DIR: /var/lib/integra/imagenes
      # Los canales de venta descargan las fotos desde esta URL con un cliente
      # anónimo: si apunta a localhost, publican fichas sin imagen. En
      # producción va el dominio público real.
      INTEGRA_PUBLIC_BASE_URL: ${INTEGRA_PUBLIC_BASE_URL:-http://localhost:8080}
    ports:
      - "8080:8080"
    volumes:
      # El banco de imágenes es la única copia que existe: sin volumen, se
      # pierde entero al recrear el contenedor y las publicaciones quedan
      # apuntando a fotos que ya no están.
      - imagenes_data:/var/lib/integra/imagenes
    logging: &registro
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: integra-worker
    # Mismo binario que la API, distinto subcomando: así no pueden divergir
    # las dependencias ni la versión del esquema entre ambos procesos.
    command: ["worker"]
    restart: unless-stopped
    # Docker manda SIGKILL a los 10 s por defecto, y el worker espera hasta 30
    # a que terminen los envíos que ya están hablando con un canal. Sin este
    # margen, un despliegue cortaría publicaciones a la mitad y el reintento
    # podría duplicarlas.
    stop_grace_period: 45s
    environment:
      INTEGRA_DATABASE_URL: postgres://integra:integra_dev@postgres:5432/integra?sslmode=disable
      INTEGRA_MASTER_KEY: ${INTEGRA_MASTER_KEY:?define INTEGRA_MASTER_KEY}
      INTEGRA_LOG_LEVEL: ${INTEGRA_LOG_LEVEL:-info}
      INTEGRA_IMAGE_DIR: /var/lib/integra/imagenes
      # El worker es quien arma los payloads que se envían al canal, así que
      # necesita la misma URL pública que la API o publicará URLs de imagen
      # que el canal no puede descargar.
      INTEGRA_PUBLIC_BASE_URL: ${INTEGRA_PUBLIC_BASE_URL:-http://localhost:8080}
    volumes:
      - imagenes_data:/var/lib/integra/imagenes
    logging: *registro
    depends_on:
      postgres:
        condition: service_healthy

  # El frontend llega en la Fase 5. Se deja comentado a propósito: un servicio
  # que no puede construirse rompería `docker compose up` entero.
  #
  # web:
  #   build:
  #     context: ./web
  #   container_name: integra-web
  #   environment:
  #     VITE_API_URL: http://localhost:8080
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - api

volumes:
  postgres_data:
  # Las fotos aptas para publicar se buscaron, recortaron y verificaron una a
  # una: reconstruirlas cuesta horas de proceso y no hay copia en Odoo, cuyas
  # imágenes son miniaturas que los marketplaces rechazan.
  imagenes_data:
